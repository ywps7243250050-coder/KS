  .service-list button,.action-link{border:1px solid #d8e4f7;background:#f5f8ff;border-radius:12px;padding:13px;text-align:left;color:#123064;font-weight:700;cursor:pointer}

  @media(max-width:600px){.modal{padding:20px}.modal h2{font-size:21px}.service-list{grid-template-columns:1fr}}

<body>
<main class="page" aria-label="Beranda KostService">
  <img class="design" src="beranda-kostservice.png" alt="Tampilan beranda KostService dengan katalog layanan cleaning, laundry, delivery, repair, dan care">
  <a class="hotspot brand" href="#" data-panel="home" aria-label="KostService - Beranda"></a>
  <a class="hotspot nav-home" href="#" data-panel="home" aria-label="Beranda"></a>

  <a class="hotspot hero-wa" href="https://wa.me/6282114933545?text=Halo%20KostService%2C%20saya%20ingin%20bertanya%20tentang%20layanan." target="_blank" rel="noopener" aria-label="Chat WhatsApp"></a>

  <button class="hotspot service s4" data-service="Kost Repair" aria-label="Pesan Kost Repair"></button>
  <button class="hotspot service s5" data-service="Kost Care" aria-label="Pesan Kost Care"></button>
  <button class="hotspot learn" data-panel="about" aria-label="Pelajari lebih lanjut"></button>
  <button class="hotspot testimonials" data-panel="testimonials" aria-label="Lihat semua testimoni"></button>
  <a class="hotspot footer-home" href="#" data-panel="home" aria-label="Beranda footer"></a>
  <a class="hotspot footer-services" href="#" data-panel="services" aria-label="Layanan footer"></a>
  <a class="hotspot footer-price" href="#" data-panel="price" aria-label="Harga footer"></a>
  <a class="hotspot footer-about" href="#" data-panel="about" aria-label="Tentang Kami footer"></a>

  <a class="hotspot footer-contact" href="#" data-panel="contact" aria-label="Kontak footer"></a>
  <a class="hotspot footer-wa" href="https://wa.me/6282114933545?text=Halo%20KostService%2C%20saya%20ingin%20memesan%20layanan." target="_blank" rel="noopener" aria-label="Pesan sekarang melalui WhatsApp"></a>

</main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <section class="modal">
    <button class="close" id="close" aria-label="Tutup">&times;</button>
    <div id="modal-content"></div>
  </section>
</div>
<script>
const modal=document.getElementById('modal');
const content=document.getElementById('modal-content');
let selectedService='';
function openModal(html){content.innerHTML=html;modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');}
document.getElementById('close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function booking(service=''){
  selectedService=service;
  openModal(`
    <h2 id="modal-title">Pesan Layanan KostService</h2>
    <p>Isi data berikut. Pesanan akan diteruskan ke WhatsApp KostService.</p>
    <form id="booking-form">
      <label for="nama">Nama</label><input id="nama" name="nama" placeholder="Nama Anda" required>
      <label for="kamar">Alamat / nomor kamar kos</label><input id="kamar" name="kamar" placeholder="Contoh: Kos Melati, kamar 203" required>
      <label for="layanan">Pilih layanan</label>
      <select id="layanan" name="layanan" required>
        <option value="">-- Pilih layanan --</option>
        ${['Kost Cleaning','Kost Laundry','Kost Delivery','Kost Repair','Kost Care'].map(s=>`<option ${s===service?'selected':''}>${s}</option>`).join('')}
      </select>
      <label for="tanggal">Tanggal layanan yang diinginkan</label><input id="tanggal" name="tanggal" type="date" required>
      <label for="detail">Detail pesanan (opsional)</label><textarea id="detail" name="detail" placeholder="Jelaskan kebutuhan Anda..."></textarea>
      <button class="submit" type="submit">Kirim Pesanan via WhatsApp</button>
    </form>
    <div class="note">Harga akhir dan jadwal akan dikonfirmasi oleh admin melalui WhatsApp.</div>
  `);
  document.getElementById('booking-form').addEventListener('submit',e=>{
    e.preventDefault();
    const f=new FormData(e.currentTarget);
    const msg=`Halo KostService, saya ingin memesan layanan.%0A nama: ${encodeURIComponent(f.get('nama'))}%0AAlamat/nomor kamar: ${encodeURIComponent(f.get('kamar'))}%0ALayanan: ${encodeURIComponent(f.get('layanan'))}%0ATanggal: ${encodeURIComponent(f.get('tanggal'))}%0ADetail: ${encodeURIComponent(f.get('detail')||'-')}`;
    window.open('https://wa.me/6282114933545?text='+msg,'_blank','noopener');
    closeModal();
  });
}
const panels={
 home:`<h2 id="modal-title">Selamat datang di KostService!</h2><p>Solusi praktis untuk kebutuhan anak kos. Pilih layanan yang Anda butuhkan dan pesan langsung melalui WhatsApp.</p><button class="submit" data-book>Pesan Layanan Sekarang</button>`,
 services:`<h2 id="modal-title">Katalog Layanan Kami</h2><p>Pilih salah satu layanan untuk mengisi formulir pemesanan.</p><div class="service-list">${[['Kost Cleaning','Kamar bersih, nyaman, dan sehat'],['Kost Laundry','Cuci pakaian cepat dan bersih'],['Kost Delivery','Antar kebutuhan Anda'],['Kost Repair','Perbaikan ringan dan cepat'],['Kost Care','Perawatan berkala']].map(([n,d])=>`<button data-service="${n}">${n}<small>${d}</small></button>`).join('')}</div>`,
 price:`<h2 id="modal-title">Harga Layanan</h2><p>Harga awal sesuai informasi pada desain.</p><div class="price">Mulai Rp25.000</div><p>Biaya dapat berbeda sesuai jenis layanan, lokasi, dan tingkat pekerjaan. Konfirmasi harga final melalui admin.</p><button class="submit" data-book>Pesan Sekarang</button>`,
 about:`<h2 id="modal-title">Tentang KostService</h2><p>KostService hadir sebagai solusi praktis untuk membantu kebutuhan anak kos, mulai dari cleaning, laundry, delivery, hingga perbaikan ringan dan perawatan berkala.</p><p><b>Komitmen kami:</b> pelayanan cepat, aman dan terpercaya, customer service responsif, serta harga transparan.</p><button class="submit" data-book>Gunakan Layanan Kami</button>`,
 testimonials:`<h2 id="modal-title">Testimoni Pelanggan</h2><p>“Pelayanannya cepat, kamar jadi lebih bersih dan nyaman. Recommended banget untuk anak kos!”</p><b>— Siti Rahma, Mahasiswi</b><p style="margin-top:14px">Kami senang membantu kamar kos Anda tetap nyaman.</p>`,
 contact:`<h2 id="modal-title">Hubungi KostService</h2><p>Customer service kami siap membantu kebutuhan kos Anda.</p><p><b>WhatsApp: 0821-1493-3545</b></p><a class="submit" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/6282114933545" target="_blank" rel="noopener">Chat WhatsApp Sekarang</a>`
};
document.addEventListener('click',e=>{
  const service=e.target.closest('[data-service]');
  const book=e.target.closest('[data-book]');
  const panel=e.target.closest('[data-panel]');
  if(service){booking(service.dataset.service);return;}
  if(book){booking();return;}
  if(panel){e.preventDefault();const key=panel.dataset.panel;openModal(panels[key]||panels.home);}
});
</script>
</body>
</html>
